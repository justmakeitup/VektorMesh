spring:
  datasource:
    url: jdbc:h2:mem:vektormesh;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

grpc:
  client:
    inference-engine:
      address: 'static://127.0.0.1:50052'
      negotiation-type: plaintext
